[project]
name = "youkelele"
version = "0.1.0"
description = "Turn a YouTube URL into a ukulele chord-and-strum sheet"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "yt-dlp[default,deno]",
    "static-ffmpeg",
    "audio-separator[cpu]",
    "audioread",
    "beat-this",
    "torch",
    "librosa>=1.0",
    "soundfile",
    "mir_eval",
    "numpy",
    "scipy",
    "scikit-learn",
    "pydantic>=2",
    "jinja2",
    "playwright==1.63.0",
    "h5py",
    "joblib",
    "pydub",
    "pretty_midi",
]

[project.scripts]
youkelele = "youkelele.cli:main"

[dependency-groups]
dev = [
    "pypdf>=6.19.0",
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youkelele"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (model downloads, real audio)"]
